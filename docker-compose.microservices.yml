name: totallyswipes-microservices

x-go-service: &go-service
  restart: unless-stopped
  stop_grace_period: 30s
  networks: [backend, data]
  volumes:
    - microservices_logs:/logs
  healthcheck:
    test: ["CMD", "healthcheck", "-grpc", "127.0.0.1:50051"]
    interval: 5s
    timeout: 4s
    retries: 12
    start_period: 15s

services:
  postgres:
    image: postgis/postgis:16-3.6
    restart: unless-stopped
    env_file:
      - path: ./deploy/env/postgres.env
        format: raw
    volumes:
      - microservices_pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - microservices_redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: dhi.io/minio:latest
    restart: unless-stopped
    env_file:
      - path: ./deploy/env/minio.env
        format: raw
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    volumes:
      - microservices_miniodata:/data
    networks: [data]

  auth:
    <<: *go-service
    image: ${IMAGE_PREFIX:-totallyswipes}/auth:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.microservices
      args:
        SERVICE_PATH: ./services/auth/cmd
        VERSION: ${IMAGE_TAG:-development}
    env_file:
      - path: ./deploy/env/auth.env
        format: raw
    environment:
      GRPC_PORT: "50051"
      PROFILE_GRPC_ADDR: profile-${DEPLOYMENT_ID:-local}:50051
    networks:
      backend:
        aliases: ["auth-${DEPLOYMENT_ID:-local}"]
      data:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      profile:
        condition: service_healthy

  profile:
    <<: *go-service
    image: ${IMAGE_PREFIX:-totallyswipes}/profile:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.microservices
      args:
        SERVICE_PATH: ./services/profile/cmd
        VERSION: ${IMAGE_TAG:-development}
    env_file:
      - path: ./deploy/env/profile.env
        format: raw
    environment:
      GRPC_PORT: "50051"
    networks:
      backend:
        aliases: ["profile-${DEPLOYMENT_ID:-local}"]
      data:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  matching:
    <<: *go-service
    image: ${IMAGE_PREFIX:-totallyswipes}/matching:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.microservices
      args:
        SERVICE_PATH: ./services/matching/cmd
        VERSION: ${IMAGE_TAG:-development}
    env_file:
      - path: ./deploy/env/matching.env
        format: raw
    environment:
      GRPC_PORT: "50051"
      PROFILE_GRPC_ADDR: profile-${DEPLOYMENT_ID:-local}:50051
      CHAT_GRPC_ADDR: chat-${DEPLOYMENT_ID:-local}:50051
    networks:
      backend:
        aliases: ["matching-${DEPLOYMENT_ID:-local}"]
      data:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      profile:
        condition: service_healthy
      chat:
        condition: service_healthy

  chat:
    <<: *go-service
    image: ${IMAGE_PREFIX:-totallyswipes}/chat:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.microservices
      args:
        SERVICE_PATH: ./services/chat/cmd
        VERSION: ${IMAGE_TAG:-development}
    env_file:
      - path: ./deploy/env/chat.env
        format: raw
    environment:
      GRPC_PORT: "50051"
      PROFILE_GRPC_ADDR: profile-${DEPLOYMENT_ID:-local}:50051
    networks:
      backend:
        aliases: ["chat-${DEPLOYMENT_ID:-local}"]
      data:
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      profile:
        condition: service_healthy

  gateway:
    <<: *go-service
    image: ${IMAGE_PREFIX:-totallyswipes}/gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.microservices
      args:
        SERVICE_PATH: ./gateway/cmd
        VERSION: ${IMAGE_TAG:-development}
    env_file:
      - path: ./deploy/env/gateway.env
        format: raw
    environment:
      PORT: "8080"
      AUTH_GRPC_ADDR: auth-${DEPLOYMENT_ID:-local}:50051
      PROFILE_GRPC_ADDR: profile-${DEPLOYMENT_ID:-local}:50051
      MATCHING_GRPC_ADDR: matching-${DEPLOYMENT_ID:-local}:50051
      CHAT_GRPC_ADDR: chat-${DEPLOYMENT_ID:-local}:50051
      TLS_CERT_FILE: ""
      TLS_KEY_FILE: ""
    networks:
      backend:
      edge:
        aliases: ["gateway-${DEPLOYMENT_ID:-local}"]
    healthcheck:
      test: ["CMD", "healthcheck", "-http", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    depends_on:
      auth:
        condition: service_healthy
      profile:
        condition: service_healthy
      matching:
        condition: service_healthy
      chat:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    container_name: totallyswipes-nginx
    restart: unless-stopped
    profiles: [edge]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONFIG_DIR:-./deploy/nginx}:/etc/nginx/conf.d:ro
      - ${NGINX_UPSTREAM_DIR:-./deploy/nginx/upstreams}:/etc/nginx/upstreams:ro
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    networks: [edge]
    depends_on:
      gateway:
        condition: service_healthy

  migrate:
    image: migrate/migrate:latest
    profiles: [tools]
    env_file:
      - path: ./deploy/env/postgres.env
        format: raw
    entrypoint: ["/bin/sh", "-ec"]
    command: ['exec migrate -path=/migrations -database "$$DATABASE_URL" up']
    volumes:
      - ./db/migrations:/migrations:ro
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge:
    name: totallyswipes-edge
    external: true
  backend:
  data:
    name: totallyswipes-data
    external: true

volumes:
  microservices_pgdata:
  microservices_redisdata:
  microservices_miniodata:
  microservices_logs:
