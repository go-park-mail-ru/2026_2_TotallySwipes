syntax="proto3";
package totallyswipes.chat.v1;

import "google/protobuf/timestamp.proto";
option go_package = "dating-app/services/chat/api/gen/go/chat/v1;chatpb";

message ChatEvent {
    string event_id = 1;

    oneof payload {
        MessageCreated message_created = 2;
        MessageUpdated message_updated = 3;
        MessageDeleted message_deleted = 4;

        ChatCard chat_created = 5;
        ChatSummary chat_summary_updated = 6;
        ChatReadUpdated chat_read_updated = 8;
        ChatCard chat_updated = 7;
    }
}


message MessageCreated {
    string chat_id = 1;
    optional string client_message_id = 2;
    ChatMessage message = 3;
}

message MessageUpdated {
    string chat_id = 1;
    ChatMessage message = 4;   
}

message MessageDeleted {
  string chat_id = 1;
  ChatMessage message = 2;
}

message ChatReadUpdated {
  string chat_id = 1;
  int64 user_id = 2;
  int64 last_read_seq = 3;
}

message GetSummaryRequest {
  int64 user_id = 1;
}

message GetSummaryResponse {
  ChatSummary summary = 1;
}

message GetChatRequest {
  int64 user_id = 1;
  string chat_id = 2;
}

message GetChatResponse {
  ChatDetails details = 1;
}

message MarkSeenRequest {
  int64 user_id = 1;
  string chat_id = 2;
}

message MarkSeenResponse {}


message GetMessageRequest {
    int64 user_id = 1;
    string chat_id = 2;
    optional int32 limit = 3;

    oneof cursor {
        int64 before_seq = 4;
        int64 after_seq = 5;
    }
}

message SendMessageRequest {
    int64 user_id = 1;
    string chat_id = 2;

    string client_message_id = 3;
    string text = 4;
}


message SendMessageResponse {
    ChatMessage message = 1;
}

message EditMessageRequest {
  int64 user_id = 1;
  string chat_id = 2;
  string message_id = 3;
  string text = 4;
}

message EditMessageResponse {
  ChatMessage message = 1;
}

message DeleteMessageRequest {
  int64 user_id = 1;
  string chat_id = 2;
  string message_id = 3;
}

message DeleteMessageResponse {
  ChatMessage message = 1;
}

message ReadChatRequest {
  int64 user_id = 1;
  string chat_id = 2;
  int64 last_read_seq = 3;
}

message ReadChatResponse {
  int64 last_read_seq = 1;
}

message SubscribeEventsRequest {
  int64 user_id = 1;
}

message ChatMessage {
  string message_id = 1;
  int64 seq = 2;
  optional int64 sender_id = 3;
  ChatMessageType type = 4;
  optional string text = 5;
  ChatAttachment attachment = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp edited_at = 8;
  google.protobuf.Timestamp deleted_at = 9;
  int64 version = 10;
}

enum ChatMessageType {
  CHAT_MESSAGE_TYPE_UNSPECIFIED = 0;
  CHAT_MESSAGE_TYPE_TEXT = 1;
  CHAT_MESSAGE_TYPE_VOICE = 2;
  CHAT_MESSAGE_TYPE_VIDEO_NOTE = 3;
  CHAT_MESSAGE_TYPE_SYSTEM = 4;
}

message ChatAttachment {
  string url = 1;
  double duration_seconds = 2;
}

message ChatSummary {
  int64 new_chats_count = 1;
  int64 unread_chats_count = 2;
  int64 unread_messages_count = 3;
  int64 version = 4;
}

message ChatCard {
  string chat_id = 1;
  int64 match_id = 2;
  ChatPeer peer = 3;
  bool is_new = 4;
  int64 unread_count = 5;
  ChatLastMessage last_message = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_activity_at = 8;
  int64 version = 9;
}

message ChatPeer {
  int64 user_id = 1;
  optional string name = 2;
  optional int32 age = 3;
  optional string avatar_url = 4;
}

message ChatLastMessage {
  string message_id = 1;
  int64 seq = 2;
  optional int64 sender_id = 3;
  ChatMessageType type = 4;
  optional string text_preview = 5;
  optional double duration_seconds = 6;
  google.protobuf.Timestamp created_at = 7;
  optional bool is_read_by_peer = 8;
}

message GetMessagesRequest {

  int64 user_id = 1;
  string chat_id = 2;
  optional int32 limit = 3; 

  oneof cursor {
    int64 before_seq = 4; 
    int64 after_seq = 5; 
  }
}

message GetMessagesResponse {
  ChatMessagesPage page = 1;
}

message ChatMessagesPage {
  repeated ChatMessage items = 1;
  ChatPageDirection direction = 2;
  
  optional int64 next_cursor = 3;
  bool has_more = 4;
}

enum ChatPageDirection {
  CHAT_PAGE_DIRECTION_UNSPECIFIED = 0;
  CHAT_PAGE_DIRECTION_OLDER = 1;
  CHAT_PAGE_DIRECTION_NEWER = 2;
}

message ChatDetails {
  ChatCard chat = 1;
  bool is_empty = 2;
  repeated string common_tags = 3;
  int64 last_read_seq = 4;
  int64 peer_last_read_seq = 5;
  ChatMessaging messaging = 6;
}

message ChatMessaging {
  bool can_send = 1;
  optional string restriction = 2;
}

message GetMediaRequest {
  int64 user_id = 1;
  string chat_id = 2;
  string message_id = 3;
}

message GetMediaResponse {
  string download_url = 1; 
}

message EnsureChatRequest {
  int64 match_id = 1;
  int64 first_user_id = 2;
  int64 second_user_id = 3;
}

message EnsureChatResponse {
  string chat_id = 1;
  bool created = 2;
}


message SendMediaRequest {
  int64 user_id = 1;
  string chat_id = 2;
  string client_message_id = 3;

  ChatMessageType type = 4;

  bytes data = 5;
}

message SendMediaResponse {
  ChatMessage message = 1;
  bool created = 2;
}

message ChatPage {
  repeated ChatCard items = 1;
  optional string next_cursor = 2;
}

message GetChatsRequest {
  int64 user_id = 1;
  // Отсутствие поля означает лимит 100.
  optional int32 limit = 2;
  // Отсутствие поля означает первую страницу со смещением 0.
  optional string cursor = 3;
}

message GetChatsResponse {
  ChatPage page = 1;
}

service ChatService {

    rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
    rpc GetChat(GetChatRequest) returns (GetChatResponse);

    rpc MarkSeen(MarkSeenRequest) returns (MarkSeenResponse);
    rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
    rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
    rpc ReadChat(ReadChatRequest) returns (ReadChatResponse);

    rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
    rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);
    rpc SubscribeEvents(SubscribeEventsRequest) returns (stream ChatEvent);
    rpc GetMedia(GetMediaRequest) returns (GetMediaResponse);

    rpc EnsureChat(EnsureChatRequest) returns (EnsureChatResponse);
    rpc SendMedia(SendMediaRequest) returns (SendMediaResponse);
    rpc GetChats(GetChatsRequest) returns (GetChatsResponse);
}