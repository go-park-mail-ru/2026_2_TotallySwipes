                    - $ref: '#/components/schemas/Attitude'
                    nullable: true
                  height:
                    type: integer
                    minimum: 100
                    maximum: 250
                    nullable: true
                    description: Рост в сантиметрах.
                  dating_goal:
                    $ref: '#/components/schemas/DatingGoal'
                  compatibility:
                    type: number
                    format: double
                    minimum: 0
                    maximum: 1
                    nullable: true
                    description: Совместимость с текущим пользователем, рассчитанная сервисом совместимости. Чем
                      выше значение, тем выше совместимость; 0 — минимальная, 1 — максимальная. Значение не является
                      вероятностью успешных отношений. null, если текущий пользователь или кандидат ещё не прошёл
                      тест.
                    example: 0.87
