openapi: 3.0.3

info:
  title: Totally Swipes
  version: 1.0.0

paths:

  /api/v1/auth/register:
    post:
      summary: Зарегистрировать пользователя
      description: >-
        Создаёт аккаунт по почте и паролю, пустую анкету и сессию. Анкета и фото
        заполняются после регистрации на онбординге через PATCH /api/v1/profile/me
        и POST /api/v1/profile/me/photos. В ответе missing перечисляет все
        обязательные поля анкеты.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: >-
                    Сервер обрезает пробелы по краям и приводит регистр к нижнему,
                    ограничения проверяются после нормализации.
                  example: alex@example.com
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 8
                  maxLength: 128
                  description: Не короче 8 символов, хотя бы одна буква и одна цифра. Пробелы не обрезаются.
                  example: qwerty123
      responses:
        '201':
          description: >-
            Пользователь зарегистрирован, сессия открыта. Если открыть сессию не удалось,
            cookies не выставляются - клиент должен отправить пользователя на логин.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Почта уже занята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: Почта уже занята
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      summary: Авторизовать пользователя
      description: >-
        Обязательные поля email и password передаются строками в JSON. 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  minLength: 1
                  maxLength: 254
                  pattern: "^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$"
                  description: >-
                    Обязательный email. Перед проверкой сервер удаляет Unicode-пробелы по краям
                    и приводит регистр к нижнему. Ограничения применяются после нормализации.
                    Формат должен соответствовать pattern; домен содержит хотя бы одну точку.
                    Внутренние пробелы и кириллица не допускаются.
                  example: alex@example.com
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
                  maxLength: 128
                  description: >-
                    Обязательный непустой пароль, не более 128 Unicode-символов (кодовых точек).
                    При входе минимальная длина 8, наличие буквы и цифры не проверяются.
                    Пробелы не обрезаются, регистр не меняется.
                  example: qwerty123
      responses:
        '400':
          $ref: '#/components/responses/ValidationError'
        '200':
          description: Вход выполнен успешно, сессия открыта.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверная почта или пароль
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        example: INVALID_CREDENTIALS
                      message:
                        type: string
                        example: Неверная почта или пароль
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      summary: Обновить сессию пользователя
      description: >-
        Меняет refresh-токен из cookie refresh_token на новую пару токенов.
        Старый refresh-токен отзывается и повторно не принимается. Вызывать,
        когда защищённая ручка ответила 401. Если сессия отсутствует, истекла
        или отозвана, необходимо войти заново.
      responses:
        '204':
          description: Сессия обновлена. Тело ответа отсутствует.
          headers:
            Set-Cookie:
              description: Новые cookie access_token и refresh_token.
              schema:
                type: string
        '401':
          description: >-
            Cookie refresh_token нет, сессия истекла, отозвана или токен уже
            использован. Cookie access_token и refresh_token удаляются.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
                        example: Необходимо войти заново
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/logout:
    post:
      summary: Завершить текущую сессию пользователя
      description: Отзывает текущую сессию. Повторный запрос, включая запрос без действующей сессии, также возвращает 204.
      responses:
        '204':
          description: Сессия завершена. Тело ответа отсутствует.
          headers:
            Set-Cookie:
              description: Cookie access_token и refresh_token удаляются (Max-Age=0).
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/tests/current:
    get:
      security:
        - cookieAuth: []
      summary: Получить текущий тест для расчёта совместимости
      description: >-
        Требуется действующая сессия; пользователь определяется middleware.
        Сервер возвращает единственный тест TIPI. Он встроен в бинарник
        (internal/psychotest/tipi.json), в БД не хранится, test_id всегда '1'.
        Клиент отображает вопросы и answer_options в полученном порядке,
        не фиксируя число вопросов или шкалу. GET не создаёт прохождение.
        ID вопросов — номера пунктов TIPI от '1' до '10'.
      responses:
        '200':
          description: Полный тест с вопросами и общей шкалой ответов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityTest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/tests/results/me:
    get:
      security:
        - cookieAuth: []
      summary: Получить свои результаты по тестам
      description: >-
        Пользователь определяется middleware, его профиль находится сервером.
        Возвращает текущие результаты пользователя в том же формате, что и
        POST /api/v1/tests/{test_id}/results: big_five и personality_type последнего
        прохождения. Повторное прохождение заменяет результат, прошлые попытки не смешиваются.
      responses:
        '200':
          description: Текущие результаты пользователя по тестам.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Пользователь ещё не проходил тест.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: TEST_RESULT_NOT_FOUND
                  message: Тест ещё не пройден
        '409':
          description: У пользователя нет профиля.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: PROFILE_REQUIRED
                  message: Сначала необходимо заполнить анкету
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/tests/{test_id}/results:
    post:
      security:
        - cookieAuth: []
      summary: Сохранить ответы теста и рассчитать показатели Big Five
      description: >-
        Пользователь определяется middleware, его профиль находится сервером.
        Клиент передаёт только ответы; методика, шкала и правила расчёта определяются
        сервером. Тест в приложении один, test_id всегда '1'; другой test_id
        даёт 404 TEST_NOT_FOUND.
        Требуется ровно один допустимый ответ на каждый вопрос, без повторов и чужих ID.
        Ответы и пять показателей Big Five сохраняются атомарно в новом прохождении.
        Эти показатели используются сервисом совместимости при формировании feed;
        POST не возвращает совместимость с конкретным пользователем.
        Каждый успешный POST создаёт новое прохождение, автоматические повторы
        после сетевой ошибки не предусмотрены.
      parameters:
        - name: test_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TestIdentifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestAnswers'
            example:
              answers:
                - question_id: '1'
                  value: 4
                - question_id: '2'
                  value: 2
      responses:
        '201':
          description: Ответы и рассчитанные показатели сохранены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Некорректный JSON, типы, неизвестные поля или формат test_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Некорректный JSON, типы, неизвестные поля или формат test_id.
        '404':
          description: Тест не найден или больше не является текущим.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: TEST_NOT_FOUND
                  message: Тест не найден или больше не является текущим.
        '409':
          description: У пользователя нет анкеты.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: PROFILE_REQUIRED
                  message: Сначала необходимо заполнить анкету
        '415':
          description: Требуется Content-Type application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: UNSUPPORTED_MEDIA_TYPE
                  message: Требуется Content-Type application/json.
        '422':
          description: Неполный набор ответов, повторные или чужие вопросы либо недопустимые значения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: INVALID_ANSWERS
                  message: Неполный набор ответов, повторные или чужие вопросы либо недопустимые значения.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/profile/me/short:
    get:
      security:
        - cookieAuth: []
      summary: Краткие данные своей анкеты
      description: >-
        Имя, возраст и главное фото для шапки и аватарки, а также состояние онбординга.
        Если missing не пуст, клиент ведёт пользователя на онбординг.
        Пройден ли психотест, видно по GET /api/v1/tests/results/me (404 - не пройден).
      responses:
        '200':
          description: Данные получены
          content:
            application/json:
              schema:
                type: object
                required: [user_id, name, age, photo_url, missing]
                properties:
                  user_id:
                    type: integer
                    format: int64
                    example: 42
                  name:
                    type: string
                    nullable: true
                    example: Аня
                  age:
                    type: integer
                    nullable: true
                    example: 22
                  photo_url:
                    type: string
                    nullable: true
                    description: URL главного фото (photos[0]). null, если фото нет.
                    example: http://localhost:8080/cats/cat-1.jpg
                  city:
                    type: string
                    nullable: true
                    description: Текущий город пользователя
                    example: Москва
                  missing:
                    $ref: '#/components/schemas/Missing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/profile/me:
    get:
      security:
        - cookieAuth: []
      summary: Своя анкета целиком
      description: Используется онбордингом и редактированием профиля. Незаполненные поля - null.
      responses:
        '200':
          description: Анкета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      security:
        - cookieAuth: []
      summary: Изменить анкету
      description: >-
        Любое непустое подмножество полей; отсутствующие поля не меняются.
        Каждый шаг онбординга - один такой запрос, «пропустить» - ничего не отправлять.
        Каждый успешный вызов создаёт новую версию анкеты. Обязательные поля очистить
        нельзя; необязательные поля (about_me, education, work, smoking, alcohol, height)
        очищаются через null, текстовые - также пустой строкой; tags заменяются целиком.
        Кого показывать в ленте, задаётся отдельно через PUT /api/v1/filters/me.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
            example:
              name: Аня
              birth_date: '2003-05-01'
              sex: female
      responses:
        '200':
          description: Анкета после изменения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/profile/me/photos:
    post:
      security:
        - cookieAuth: []
      summary: Загрузить фото
      description: >-
        Одно фото в части photo multipart/form-data, добавляется в конец списка.
        Загружается сразу при выборе; ошибка касается только этого фото.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: JPEG, PNG или WebP, не больше 5 МБ.
      responses:
        '201':
          description: Актуальный список фото
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photos'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: В анкете уже 6 фото
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: PHOTO_LIMIT
                  message: Можно загрузить не больше 6 фотографий
        '413':
          description: Слишком большой запрос
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/profile/me/photos/order:
    put:
      security:
        - cookieAuth: []
      summary: Изменить порядок фото
      description: >-
        Принимает id всех фото анкеты в новом порядке, каждый ровно один раз;
        первое становится главным. Если набор id не совпадает с текущими фото
        (например, фото удалили в другой вкладке), порядок не меняется и
        возвращается 400 с полем photo_ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [photo_ids]
              properties:
                photo_ids:
                  type: array
                  minItems: 1
                  maxItems: 6
                  uniqueItems: true
                  items:
                    type: integer
                    format: int64
                    minimum: 1
            example:
              photo_ids: [12, 7, 9]
      responses:
        '200':
          description: Актуальный список фото в новом порядке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photos'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/profile/me/photos/{photo_id}:
    delete:
      security:
        - cookieAuth: []
      summary: Удалить фото
      description: >-
        Следующие фото сдвигаются на его место; если удалена главная, главной
        становится следующая. Единственное фото заполненной анкеты удалить нельзя.
      parameters:
        - name: photo_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Актуальный список фото
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photos'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Фото не найдено в анкете
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: PHOTO_NOT_FOUND
                  message: Фото не найдено
        '409':
          description: Это единственное фото заполненной анкеты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: LAST_PHOTO
                  message: Нельзя удалить единственное фото заполненной анкеты
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/location/me:
    get:
      security:
        - cookieAuth: []
      summary: Получить своё местоположение
      description: Координаты доступны только владельцу. Если местоположение не задано, location равен null.
      responses:
        '200':
          description: Сохранённое местоположение или null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
              examples:
                notSet:
                  value:
                    location: null
                saved:
                  value:
                    location:
                      city: Хотьково
                      district: Сергиево-Посадский городской округ
                      coordinates:
                        latitude: 56.25
                        longitude: 37.99
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      security:
        - cookieAuth: []
      summary: Подтвердить и сохранить своё местоположение
      description: >-
        Создаёт или заменяет местоположение по preview_id из предварительного определения.
        Результат должен принадлежать текущему пользователю и не быть просроченным.
        Адрес и исходные координаты берутся из проверенного backend результата;
        user_id определяется по авторизации. При ошибке прежнее местоположение не меняется.
        Удаление местоположения не поддерживается.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationConfirmRequest'
      responses:
        '200':
          description: Сохранённое местоположение; location не равен null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Результат предварительного определения истёк или недоступен текущему пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: LOCATION_PREVIEW_UNAVAILABLE
                  message: Повторите определение местоположения
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/location/me/preview:
    post:
      security:
        - cookieAuth: []
      summary: Предварительно определить местоположение по координатам
      description: >-
        Определяет город и административный район или городской округ через геокодер,
        не изменяя сохранённое местоположение. Для деревни может возвращаться ближайший город.
        Поддерживается только Россия. Временный результат привязан к текущему пользователю
        и содержит исходные координаты запроса, а не координаты здания из ответа геокодера.
        Для сохранения передайте preview_id в PUT /api/v1/location/me.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationCoordinates'
      responses:
        '200':
          description: Адрес для подтверждения и временный идентификатор результата
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPreviewResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Город не определён или точка вне поддерживаемой территории; прежнее местоположение не меняется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: LOCATION_NOT_FOUND
                  message: Не удалось определить местоположение
        '429':
          $ref: '#/components/responses/GeocoderQuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/filters/me:
    get:
      security:
        - cookieAuth: []
      summary: Фильтр ленты
      description: >-
        Кого пользователь хочет видеть в ленте. Пока фильтр не задан,
        возвращаются значения по умолчанию: sex=all, age_from=18, age_to=100.
      responses:
        '200':
          description: Фильтр
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFilter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      security:
        - cookieAuth: []
      summary: Установить фильтр ленты
      description: >-
        Заменяет фильтр целиком, все поля обязательны. Пока фильтр не задан,
        в missing есть search_filter и анкета не попадает в ленту.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchFilter'
            example:
              sex: female
              age_from: 20
              age_to: 30
      responses:
        '200':
          description: Сохранённый фильтр
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFilter'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/feed:
    get:
      security:
        - cookieAuth: []
      summary: Получить ленту анкет
      description: >-
        Текущий пользователь определяется middleware авторизации; его ID не передаётся
        в параметрах запроса. В ленту попадают только анкеты, подходящие под фильтр
        пользователя (GET /api/v1/filters/me) по полу и возрасту. Backend находит анкету
        текущего пользователя и передаёт её показатели Big Five вместе с показателями
        каждого кандидата в сервис совместимости. Рассчитанное значение возвращается
        в compatibility каждой карточки.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10

        - name: cursor
          description: Курсор из next_cursor предыдущего ответа. В первом запросе не передаётся.
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            format: int64

      responses:
        '400':
          $ref: '#/components/responses/ValidationError'
        '200':
          description: Лента загружена. Если анкет нет, items пустой, next_cursor равен null.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - user_id
                        - name
                        - age
                        - about_me
                        - education
                        - work
                        - smoking
                        - alcohol
                        - height
                        - dating_goal
                        - compatibility
                        - tags
                        - photos
                        - liked_me
                        - city
                      properties:
                        user_id:
                          minimum: 1
                          type: integer
                          format: int64
                          example: 42
                        name:
                          minLength: 1
                          maxLength: 100
                          pattern: '\S'
                          description: Имя не должно состоять только из пробелов.
                          type: string
                          example: Аня
                        about_me:
                          type: string
                          nullable: true
                          description: Описание пользователя в анкете. null, если описание не задано.
                          example: Люблю путешествия и настольные игры.
                        education:
                          allOf:
                            - $ref: '#/components/schemas/Education'
                          nullable: true
                        work:
                          type: string
                          nullable: true
                          maxLength: 100
                        smoking:
                          allOf:
                            - $ref: '#/components/schemas/Attitude'
                          nullable: true
                        alcohol:
                          allOf:
                            - $ref: '#/components/schemas/Attitude'
                          nullable: true
                        height:
                          type: integer
                          minimum: 100
                          maximum: 250
                          nullable: true
                          description: Рост в сантиметрах.
                        dating_goal:
                          $ref: '#/components/schemas/DatingGoal'
                        compatibility:
                          type: number
                          format: double
                          minimum: 0
                          maximum: 1
                          nullable: true
                          description: >-
                            Совместимость с текущим пользователем, рассчитанная сервисом
                            совместимости. Чем выше значение, тем выше совместимость;
                            0 — минимальная, 1 — максимальная. Значение не является
                            вероятностью успешных отношений. null, если текущий
                            пользователь или кандидат ещё не прошёл тест.
                          example: 0.87
                        age:
                          minimum: 18
                          type: integer
                          example: 22
                        tags:
                          maxItems: 10
                          uniqueItems: true
                          type: array
                          items:
                            $ref: '#/components/schemas/TagKey'
                          example: [coffee, music]
                        photos:
                          type: array
                          minItems: 0
                          maxItems: 6
                          items:
                            type: object
                            required:
                              - id
                              - url
                            properties:
                              id:
                                minimum: 1
                                type: integer
                                format: int64
                                example: 7
                              url:
                                minLength: 1
                                type: string
                                example: /media/photo-7.jpg
                        liked_me:
                          type: boolean
                          description: >-
                            true, если последнее действие кандидата по отношению
                            к текущему пользователю — like или super_like.
                          example: false
                        city:
                          type: string
                          nullale: true
                          example: Москва
                  next_cursor:
                    minimum: 1
                    type: integer
                    format: int64
                    nullable: true
                    description: Курсор следующей порции. null, если продолжения нет.
                    example: 42
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: У текущего пользователя нет заполненной анкеты или геопозиция не зафиксирована
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        enum:
                          - PROFILE_REQUIRED
                          - LOCATION_REQUIRED
                        example: PROFILE_REQUIRED
                      message:
                        type: string
                        example: Сначала необходимо заполнить анкету
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/feed/swipe:
    post:
      summary: Выполнить свайп пользователя
      description: >-
        Свайп доступен только пользователю с заполненной анкетой.
        Если в его анкете не заполнены обязательные поля, возвращается
        403 PROFILE_REQUIRED. Отсутствие обязательных полей запроса
        target_user_id или action возвращает 400 VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_user_id
                - action
              properties:
                target_user_id:
                  description: Идентификатор другого пользователя. Свайп собственной анкеты запрещён; проверяется сервером.
                  minimum: 1
                  type: integer
                  format: int64

                action:
                  type: string
                  enum:
                    - like
                    - dislike
                    - super_like
      responses:
        '400':
          $ref: '#/components/responses/ValidationError'
        '204':
          description: Свайп сохранён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: В анкете текущего пользователя не заполнены обязательные поля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: PROFILE_REQUIRED
                  message: Сначала необходимо заполнить анкету
        '413':
          description: Слишком большой запрос
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          description: Целевая анкета не найдена или недоступна
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        example: PROFILE_NOT_FOUND
                      message:
                        type: string
                        example: Целевая анкета не найдена или недоступна
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/matches/{match_id}/search-places:
    post:
      summary: Создать или открыть активный подбор событий
      description: >-
        Доступно только участникам матча. Создаёт один общий набор из 1–10 событий
        и сразу возвращает SearchState: дополнительный GET после POST не нужен.
        Первый участник может оценивать карточки, не дожидаясь второго.
        Один активный подбор на матч, включая конкурентные запросы.
        Повтор с тем же городом возвращает сохранённое состояние без Timepad;
        другой город активного подбора даёт SEARCH_ALREADY_ACTIVE.
        TTL — 24 часа от создания без продления. Подбор состоит из одного раунда.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city]
              properties:
                city:
                  type: string
                  minLength: 1
                  description: Город встречи; после обрезки пробелов строка должна быть непустой.
                  example: Москва
      responses:
        '201':
          description: Создан подбор; объект сразу содержит общий набор карточек, status — voting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchState'
        '200':
          description: Активный подбор с тем же городом; тот же формат объекта с актуальным состоянием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchState'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlaceSearchNotFound'
        '408':
          $ref: '#/components/responses/TimepadTimeout'
        '409':
          description: Список подходящих событий пуст либо активный подбор имеет другой город
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              examples:
                noEvents:
                  value:
                    error:
                      code: NO_EVENTS
                      message: Нет подходящих событий
                alreadyActive:
                  value:
                    error:
                      code: SEARCH_ALREADY_ACTIVE
                      message: Для матча уже существует подбор в другом городе
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/matches/{match_id}/place-searches/{search_id}:
    get:
      summary: Получить состояние подбора событий
      description: >-
        Используется для присоединения, восстановления страницы и polling.
        Проверяет участие пользователя в матче и принадлежность подбора матчу.
        Читает сохранённое состояние Redis, не вызывает Timepad и не продлевает TTL.
        Оба участника получают один набор карточек в одном порядке.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - name: search_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Актуальное состояние для вызывающего участника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchState'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlaceSearchNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/matches/{match_id}/place-searches/{search_id}/results:
    post:
      summary: Отправить итоговые лайки участника подбора
      description: >-
        Доступно участнику матча; подбор должен принадлежать указанному матчу.
        Первый принятый результат фиксируется и не может быть изменён.
        Повторная отправка после принятия результата возвращает 409 RESULT_ALREADY_SUBMITTED,
        даже если набор ID совпадает или отличается только порядком. Это правило действует
        и после завершения или отмены, пока подбор доступен.
        После сетевой ошибки с неизвестным исходом или RESULT_ALREADY_SUBMITTED клиент
        получает актуальное состояние через GET подбора. Если current_user_finished=true,
        используется серверный результат; если false и подбор активен, отправку можно повторить.
        После первого результата его автор получает waiting_partner; после второго подбор
        атомарно переходит в completed. Пустое пересечение означает matches=[] и «Нет совпадений».
        Timepad не вызывается, TTL не продлевается. При конкурентной отправке результатов
        одного участника принимается только один пакет, остальные получают конфликт.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - name: search_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [liked_event_ids]
              properties:
                liked_event_ids:
                  type: array
                  nullable: false
                  uniqueItems: true
                  maxItems: 10
                  description: ID из сохранённого набора; [] означает отсутствие лайков. Поле обязательно, null недопустим.
                  items:
                    type: integer
                    format: int64
            example:
              liked_event_ids: [4180718]
      responses:
        '200':
          description: Первый результат принят; актуальное состояние для отправителя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchState'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlaceSearchNotFound'
        '409':
          description: >-
            RESULT_ALREADY_SUBMITTED — результат участника уже принят, включая повтор того же набора.
            SEARCH_STATE_CONFLICT — новый результат для конечного состояния.
            Для недоступного или истёкшего подбора возвращается 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              examples:
                alreadySubmitted:
                  value:
                    error:
                      code: RESULT_ALREADY_SUBMITTED
                      message: Результат уже принят. Получите актуальное состояние подбора.
                stateConflict:
                  value:
                    error:
                      code: SEARCH_STATE_CONFLICT
                      message: Подбор уже завершён или отменён
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/profiles/{user_id}:
