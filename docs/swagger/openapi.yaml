openapi: 3.0.3

info:
  title: Totally Swipes
  version: 1.0.0

paths:

  /api/v1/auth/register:
    post:
      summary: Зарегистрировать пользователя
      description: >-
        Создаёт аккаунт по почте и паролю, пустую анкету и сессию. Анкета и фото
        заполняются после регистрации на онбординге через PATCH /api/v1/profile/me
        и POST /api/v1/profile/me/photos. В ответе missing перечисляет все
        обязательные поля анкеты.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: >-
                    Сервер обрезает пробелы по краям и приводит регистр к нижнему,
                    ограничения проверяются после нормализации.
                  example: alex@example.com
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 8
                  maxLength: 128
                  description: Не короче 8 символов, хотя бы одна буква и одна цифра. Пробелы не обрезаются.
                  example: qwerty123
      responses:
        '201':
          description: >-
            Пользователь зарегистрирован, сессия открыта. Если открыть сессию не удалось,
            cookies не выставляются - клиент должен отправить пользователя на логин.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Почта уже занята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: Почта уже занята
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      summary: Авторизовать пользователя
      description: >-
        Обязательные поля email и password передаются строками в JSON. 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  minLength: 1
                  maxLength: 254
                  pattern: "^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$"
                  description: >-
                    Обязательный email. Перед проверкой сервер удаляет Unicode-пробелы по краям
                    и приводит регистр к нижнему. Ограничения применяются после нормализации.
                    Формат должен соответствовать pattern; домен содержит хотя бы одну точку.
                    Внутренние пробелы и кириллица не допускаются.
                  example: alex@example.com
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
                  maxLength: 128
                  description: >-
                    Обязательный непустой пароль, не более 128 Unicode-символов (кодовых точек).
                    При входе минимальная длина 8, наличие буквы и цифры не проверяются.
                    Пробелы не обрезаются, регистр не меняется.
                  example: qwerty123
      responses:
        '400':
          $ref: '#/components/responses/ValidationError'
        '200':
          description: Вход выполнен успешно, сессия открыта.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверная почта или пароль
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        example: INVALID_CREDENTIALS
                      message:
                        type: string
                        example: Неверная почта или пароль
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      summary: Обновить сессию пользователя
      description: >-
        Меняет refresh-токен из cookie refresh_token на новую пару токенов.
        Старый refresh-токен отзывается и повторно не принимается. Вызывать,
        когда защищённая ручка ответила 401. Если сессия отсутствует, истекла
        или отозвана, необходимо войти заново.
      responses:
        '204':
          description: Сессия обновлена. Тело ответа отсутствует.
          headers:
            Set-Cookie:
              description: Новые cookie access_token и refresh_token.
              schema:
                type: string
        '401':
          description: >-
            Cookie refresh_token нет, сессия истекла, отозвана или токен уже
            использован. Cookie access_token и refresh_token удаляются.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
                        example: Необходимо войти заново
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/logout:
    post:
      summary: Завершить текущую сессию пользователя
      description: Отзывает текущую сессию. Повторный запрос, включая запрос без действующей сессии, также возвращает 204.
      responses:
        '204':
          description: Сессия завершена. Тело ответа отсутствует.
          headers:
            Set-Cookie:
              description: Cookie access_token и refresh_token удаляются (Max-Age=0).
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/tests/current:
    get:
      security:
        - cookieAuth: []
      summary: Получить текущий тест для расчёта совместимости
      description: >-
        Требуется действующая сессия; пользователь определяется middleware.
        Сервер возвращает единственный тест TIPI. Он встроен в бинарник
        (internal/psychotest/tipi.json), в БД не хранится, test_id всегда '1'.
        Клиент отображает вопросы и answer_options в полученном порядке,
        не фиксируя число вопросов или шкалу. GET не создаёт прохождение.
        ID вопросов — номера пунктов TIPI от '1' до '10'.
      responses:
        '200':
          description: Полный тест с вопросами и общей шкалой ответов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityTest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/tests/results/me:
    get:
      security:
        - cookieAuth: []
      summary: Получить свои результаты по тестам
      description: >-
        Пользователь определяется middleware, его профиль находится сервером.
        Возвращает текущие результаты пользователя в том же формате, что и
        POST /api/v1/tests/{test_id}/results: big_five и personality_type последнего
        прохождения. Повторное прохождение заменяет результат, прошлые попытки не смешиваются.
      responses:
        '200':
          description: Текущие результаты пользователя по тестам.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Пользователь ещё не проходил тест.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: TEST_RESULT_NOT_FOUND
                  message: Тест ещё не пройден
        '409':
          description: У пользователя нет профиля.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: PROFILE_REQUIRED
                  message: Сначала необходимо заполнить анкету
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/tests/{test_id}/results:
    post:
      security:
        - cookieAuth: []
      summary: Сохранить ответы теста и рассчитать показатели Big Five
      description: >-
        Пользователь определяется middleware, его профиль находится сервером.
        Клиент передаёт только ответы; методика, шкала и правила расчёта определяются
        сервером. Тест в приложении один, test_id всегда '1'; другой test_id
        даёт 404 TEST_NOT_FOUND.
        Требуется ровно один допустимый ответ на каждый вопрос, без повторов и чужих ID.
        Ответы и пять показателей Big Five сохраняются атомарно в новом прохождении.
        Эти показатели используются сервисом совместимости при формировании feed;
        POST не возвращает совместимость с конкретным пользователем.
        Каждый успешный POST создаёт новое прохождение, автоматические повторы
        после сетевой ошибки не предусмотрены.
      parameters:
        - name: test_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TestIdentifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestAnswers'
            example:
              answers:
                - question_id: '1'
                  value: 4
                - question_id: '2'
                  value: 2
      responses:
        '201':
          description: Ответы и рассчитанные показатели сохранены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Некорректный JSON, типы, неизвестные поля или формат test_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Некорректный JSON, типы, неизвестные поля или формат test_id.
        '404':
          description: Тест не найден или больше не является текущим.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: TEST_NOT_FOUND
                  message: Тест не найден или больше не является текущим.
        '409':
          description: У пользователя нет анкеты.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: PROFILE_REQUIRED
                  message: Сначала необходимо заполнить анкету
        '415':
          description: Требуется Content-Type application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: UNSUPPORTED_MEDIA_TYPE
                  message: Требуется Content-Type application/json.
        '422':
          description: Неполный набор ответов, повторные или чужие вопросы либо недопустимые значения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: INVALID_ANSWERS
                  message: Неполный набор ответов, повторные или чужие вопросы либо недопустимые значения.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/profile/me/short:
    get:
      security:
        - cookieAuth: []
      summary: Краткие данные своей анкеты
      description: >-
        Имя, возраст и главное фото для шапки и аватарки, а также состояние онбординга.
        Если missing не пуст, клиент ведёт пользователя на онбординг.
        Пройден ли психотест, видно по GET /api/v1/tests/results/me (404 - не пройден).
      responses:
        '200':
          description: Данные получены
          content:
            application/json:
              schema:
                type: object
                required: [user_id, name, age, photo_url, missing]
                properties:
                  user_id:
                    type: integer
                    format: int64
                    example: 42
                  name:
                    type: string
                    nullable: true
                    example: Аня
                  age:
                    type: integer
                    nullable: true
                    example: 22
                  photo_url:
                    type: string
                    nullable: true
                    description: URL главного фото (photos[0]). null, если фото нет.
                    example: http://localhost:8080/cats/cat-1.jpg
                  missing:
                    $ref: '#/components/schemas/Missing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/profile/me:
    get:
      security:
        - cookieAuth: []
      summary: Своя анкета целиком
      description: Используется онбордингом и редактированием профиля. Незаполненные поля - null.
      responses:
        '200':
          description: Анкета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      security:
        - cookieAuth: []
      summary: Изменить анкету
      description: >-
        Любое непустое подмножество полей; отсутствующие поля не меняются.
        Каждый шаг онбординга - один такой запрос, «пропустить» - ничего не отправлять.
        Каждый успешный вызов создаёт новую версию анкеты. Обязательные поля очистить
        нельзя; about_me очищается через null или пустую строку; tags заменяются целиком.
        search_age_from и search_age_to передаются только вместе.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
            example:
              name: Аня
              birth_date: '2003-05-01'
              sex: female
      responses:
        '200':
          description: Анкета после изменения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/profile/me/photos:
    post:
      security:
        - cookieAuth: []
      summary: Загрузить фото
      description: >-
        Одно фото в части photo multipart/form-data, добавляется в конец списка.
        Загружается сразу при выборе; ошибка касается только этого фото.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: JPEG, PNG или WebP, не больше 5 МБ.
      responses:
        '201':
          description: Актуальный список фото
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photos'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: В анкете уже 6 фото
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: PHOTO_LIMIT
                  message: Можно загрузить не больше 6 фотографий
        '413':
          description: Слишком большой запрос
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/profile/me/photos/{photo_id}:
    delete:
      security:
        - cookieAuth: []
      summary: Удалить фото
      description: >-
        Следующие фото сдвигаются на его место; если удалена главная, главной
        становится следующая. Единственное фото заполненной анкеты удалить нельзя.
      parameters:
        - name: photo_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Актуальный список фото
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photos'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Фото не найдено в анкете
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: PHOTO_NOT_FOUND
                  message: Фото не найдено
        '409':
          description: Это единственное фото заполненной анкеты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: LAST_PHOTO
                  message: Нельзя удалить единственное фото заполненной анкеты
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/feed:
    get:
      security:
        - cookieAuth: []
      summary: Получить ленту анкет
      description: >-
        Текущий пользователь определяется middleware авторизации; его ID не передаётся
        в параметрах запроса. Backend находит анкету текущего пользователя и передаёт
        её показатели Big Five вместе с показателями каждого кандидата в сервис
        совместимости. Рассчитанное значение возвращается в compatibility каждой карточки.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10

        - name: cursor
          description: Курсор из next_cursor предыдущего ответа. В первом запросе не передаётся.
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            format: int64

      responses:
        '400':
          $ref: '#/components/responses/ValidationError'
        '200':
          description: Лента загружена. Если анкет нет, items пустой, next_cursor равен null.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - user_id
                        - name
                        - age
                        - about_me
                        - dating_goal
                        - compatibility
                        - tags
                        - photos
                      properties:
                        user_id:
                          minimum: 1
                          type: integer
                          format: int64
                          example: 42
                        name:
                          minLength: 1
                          maxLength: 100
                          pattern: '\S'
                          description: Имя не должно состоять только из пробелов.
                          type: string
                          example: Аня
                        about_me:
                          type: string
                          nullable: true
                          description: Описание пользователя в анкете. null, если описание не задано.
                          example: Люблю путешествия и настольные игры.
                        dating_goal:
                          $ref: '#/components/schemas/DatingGoal'
                        compatibility:
                          type: number
                          format: double
                          minimum: 0
                          maximum: 1
                          nullable: true
                          description: >-
                            Совместимость с текущим пользователем, рассчитанная сервисом
                            совместимости. Чем выше значение, тем выше совместимость;
                            0 — минимальная, 1 — максимальная. Значение не является
                            вероятностью успешных отношений. null, если текущий
                            пользователь или кандидат ещё не прошёл тест.
                          example: 0.87
                        age:
                          minimum: 18
                          type: integer
                          example: 22
                        tags:
                          maxItems: 10
                          uniqueItems: true
                          type: array
                          items:
                            $ref: '#/components/schemas/TagKey'
                          example: [sport]
                        photos:
                          type: array
                          minItems: 0
                          maxItems: 6
                          items:
                            type: object
                            required:
                              - id
                              - url
                            properties:
                              id:
                                minimum: 1
                                type: integer
                                format: int64
                                example: 7
                              url:
                                minLength: 1
                                type: string
                                example: /media/photo-7.jpg
                  next_cursor:
                    minimum: 1
                    type: integer
                    format: int64
                    nullable: true
                    description: Курсор следующей порции. null, если продолжения нет.
                    example: 42
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: У текущего пользователя нет анкеты
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        example: PROFILE_REQUIRED
                      message:
                        type: string
                        example: Сначала необходимо заполнить анкету
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/feed/swipe:
    post:
      summary: Выполнить свайп пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_user_id
                - action
              properties:
                target_user_id:
                  description: Идентификатор другого пользователя. Свайп собственной анкеты запрещён; проверяется сервером.
                  minimum: 1
                  type: integer
                  format: int64

                action:
                  type: string
                  enum:
                    - like
                    - dislike
      responses:
        '400':
          $ref: '#/components/responses/ValidationError'
        '204':
          description: Свайп сохранён
        '404':
          description: Целевая анкета не найдена или недоступна
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        example: PROFILE_NOT_FOUND
                      message:
                        type: string
                        example: Целевая анкета не найдена или недоступна
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  headers:
    SessionCookies:
      description: |
        Две HttpOnly cookie сессии (Secure, SameSite=Lax), клиенту их читать не нужно:
        - access_token - JWT, Path=/, живёт JWT_ACCESS_TTL (по умолчанию 15 минут);
        - refresh_token - непрозрачный токен, Path=/api/v1/auth, живёт JWT_REFRESH_TTL (по умолчанию 30 дней).
      schema:
        type: string
        example: access_token=eyJhbGciOi...; Path=/; HttpOnly; Secure; SameSite=Lax
  schemas:
    DatingGoal:
      type: string
      description: Ключ цели знакомства; подписи хранит клиент.
      enum: [relationship, friendship, casual]
      example: relationship
    Missing:
      type: array
      description: >-
        Обязательные поля анкеты, которых не хватает, в порядке шагов онбординга.
        Пустой массив - анкета заполнена и показывается в ленте. Тест сюда не входит.
      items:
        type: string
        enum: [name, birth_date, sex, dating_goal, search_sex, search_age, photos]
      example: [search_sex, search_age, photos]
    AuthResponse:
      type: object
      required: [user_id, missing]
      properties:
        user_id:
          type: integer
          format: int64
          example: 12
        missing:
          $ref: '#/components/schemas/Missing'
    Photo:
      type: object
      required: [id, url]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        url:
          type: string
          example: http://localhost:8080/cats/cat-1.jpg
    Photos:
      type: object
      required: [photos]
      properties:
        photos:
          type: array
          maxItems: 6
          description: Фото в порядке отображения; photos[0] - главная.
          items:
            $ref: '#/components/schemas/Photo'
    Profile:
      type: object
      required: [user_id, name, birth_date, age, sex, dating_goal, about_me, search_sex,
        search_age_from, search_age_to, tags, photos, missing]
      properties:
        user_id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        age:
          type: integer
          nullable: true
        sex:
          type: string
          enum: [male, female]
          nullable: true
        dating_goal:
          allOf:
            - $ref: '#/components/schemas/DatingGoal'
          nullable: true
        about_me:
          type: string
          nullable: true
        search_sex:
          type: string
          enum: [male, female, all]
          nullable: true
        search_age_from:
          type: integer
          nullable: true
        search_age_to:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagKey'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        missing:
          $ref: '#/components/schemas/Missing'
    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 64
          description: Пробелы по краям обрезаются, внутренние схлопываются.
        birth_date:
          type: string
          format: date
          description: Пользователю должно быть не меньше 18 лет.
        sex:
          type: string
          enum: [male, female]
        dating_goal:
          $ref: '#/components/schemas/DatingGoal'
        about_me:
          type: string
          nullable: true
          maxLength: 1000
          description: null или пустая строка очищают описание.
        search_sex:
          type: string
          enum: [male, female, all]
        search_age_from:
          type: integer
          minimum: 18
          maximum: 100
        search_age_to:
          type: integer
          minimum: 18
          maximum: 100
          description: Не меньше search_age_from.
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Заменяет набор тегов целиком.
          items:
            $ref: '#/components/schemas/TagKey'
    TagKey:
      type: string
      description: >-
        Ключ тега из фиксированного справочника (таблица tag, миграция 000002).
        Бэкенд справочник не изменяет.
      enum: [coffee, books, music, hiking, bicycle, travel, photo, board_games,
        cooking, running, painting, movies, concerts, animals, sport]
      example: coffee
    TestIdentifier:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Положительный BIGINT в виде десятичной строки.
      example: '1'
    CompatibilityTest:
      type: object
      required: [test_id, title, instructions, answer_options, questions]
      properties:
        test_id:
          $ref: '#/components/schemas/TestIdentifier'
        title:
          type: string
          example: Психологическая анкета
        instructions:
          type: string
          example: Для каждого утверждения выберите один вариант ответа.
        answer_options:
          type: array
          minItems: 1
          description: Общая шкала для всех вопросов; value уникальны и задаются определением теста.
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: integer
                example: 1
              label:
                type: string
                example: Совсем не согласен
        questions:
          type: array
          minItems: 1
          description: Полный список вопросов в порядке отображения; id уникальны.
          items:
            type: object
            required: [id, body]
            properties:
              id:
                $ref: '#/components/schemas/TestIdentifier'
              body:
                type: string
                example: Текст утверждения
    TestAnswers:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          description: >-
            Все ответы теста; порядок не важен. Повторы question_id запрещены.
            Пустой массив, как и неполный набор ответов, - ошибка 422 INVALID_ANSWERS.
          items:
            type: object
            additionalProperties: false
            required: [question_id, value]
            properties:
              question_id:
                $ref: '#/components/schemas/TestIdentifier'
              value:
                type: integer
                description: Одно из значений answer_options выбранного теста. Ноль не означает пропуск.
                example: 4
    TestResult:
      type: object
      required: [result_id, test_id, revision, completed_at, big_five, personality_type, about_personality_type]
      properties:
        result_id:
          $ref: '#/components/schemas/TestIdentifier'
        test_id:
          $ref: '#/components/schemas/TestIdentifier'
        revision:
          type: integer
          minimum: 1
          description: Номер прохождения профиля, а не версия методики.
          example: 1
        completed_at:
          type: string
          format: date-time
          example: '2026-09-25T12:00:00Z'
        big_five:
          $ref: '#/components/schemas/TestBigFive'
        personality_type:
          type: string
          description: Ближайший авторский тип по пяти координатам текущего прохождения; не психологический диагноз. При равных расстояниях выбирается первый тип в списке enum.
          enum: [EXPLORER, VISIONARY, STRATEGIST, INVENTOR, DREAMER, CURATOR, INSPIRER, DEBATER, ORGANIZER, CONNECTOR, COMPANION, DRIVER, ANCHOR, CRAFTSPERSON, OBSERVER, KEEPER]
          example: STRATEGIST
        about_personality_type:
          type: string
          description: Описание выбранного типа на русском языке.
          example: 'Стратег: вам ближе новые идеи, продуманный подход и спокойный формат общения.'
    TestBigFive:
      type: object
      description: Нормализованный вектор текущего прохождения до смешивания с предыдущим профилем. Высокое N означает высокий нейротизм.
      required: [openness, conscientiousness, extraversion, agreeableness, neuroticism]
      properties:
        openness:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.85
        conscientiousness:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.8
        extraversion:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.25
        agreeableness:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.55
        neuroticism:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.2
    TestError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INVALID_ANSWERS
            message:
              type: string
              example: Необходимо ответить на все вопросы теста.
            details:
              type: array
              description: Детали ошибок отдельных ответов для INVALID_ANSWERS.
              items:
                type: object
                required: [question_id, code]
                properties:
                  question_id:
                    $ref: '#/components/schemas/TestIdentifier'
                  code:
                    type: string
                    enum: [MISSING_ANSWER, DUPLICATE_QUESTION, QUESTION_NOT_IN_TEST, VALUE_OUT_OF_RANGE]
  responses:
    UnsupportedMediaType:
      description: Тело должно быть application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TestError'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Требуется Content-Type application/json
    Unauthorized:
      description: >-
        Access-токен отсутствует, недействителен или истёк. Клиенту нужно вызвать
        POST /api/v1/auth/refresh и повторить запрос; если refresh тоже вернул 401,
        необходимо войти заново.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Необходима авторизация
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Внутренняя ошибка сервера
    ValidationError:
      description: Некорректные поля или параметры запроса
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Проверьте поля запроса
                  fields:
                    type: object
                    description: >-
                      Ошибки по полям тела запроса: ключ - имя поля, значение - текст ошибки.
                      Отсутствует, если ошибка не относится к конкретным полям.
                    additionalProperties:
                      type: string
                    example:
                      email: некорректный email
                      search_age_to: верхняя граница возраста не может быть меньше нижней

