  /api/v1/matches:
    get:
      security:
        - cookieAuth: []
      summary: Получить список мэтчей
      description: >-
        Мэтч возникает, когда оба пользователя поставили друг другу like или super_like
        (POST /api/v1/feed/swipe). Возвращаются мэтчи текущего пользователя от новых к старым
        с краткими данными собеседника для страницы «Симпатии».
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 12

        - name: cursor
          description: Курсор из next_cursor предыдущего ответа. В первом запросе не передаётся.
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            format: int64

      responses:
        '200':
          description: Мэтчи загружены. Если мэтчей нет, items пустой, next_cursor равен null.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, next_cursor]
                properties:
                  total:
                    type: integer
                    description: Общее число мэтчей пользователя, не зависит от cursor.
                    example: 12
                  items:
                    type: array
                    items:
                      type: object
                      required: [match_id, user_id, name, age, photo_url, compatibility, is_new, created_at]
                      properties:
                        match_id:
                          type: integer
                          format: int64
                          example: 15
                        user_id:
                          description: Идентификатор собеседника.
                          type: integer
                          format: int64
                          example: 42
                        name:
                          type: string
                          nullable: true
                          example: Аня
                        age:
                          type: integer
                          nullable: true
                          example: 22
                        photo_url:
                          type: string
                          nullable: true
                          description: URL главного фото собеседника. null, если фото нет.
                          example: http://localhost:8080/cats/cat-1.jpg
                        compatibility:
                          type: number
                          format: double
                          minimum: 0
                          maximum: 1
                          nullable: true
                          description: Совместимость по Big Five. null, если кто-то из пары не прошёл тест.
                          example: 0.87
                        is_new:
                          type: boolean
                          description: Текущий пользователь ещё не открывал этот мэтч (POST /api/v1/matches/{match_id}/seen).
                          example: true
                        created_at:
                          type: string
                          format: date-time
                          example: '2026-10-18T12:00:00Z'
                  next_cursor:
                    type: integer
                    format: int64
                    nullable: true
                    description: match_id последнего элемента, если есть следующая страница.
                    example: 15
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /api/v1/matches/summary:
    get:
      security:
        - cookieAuth: []
      summary: Счётчик мэтчей для навигации
      description: >-
        Лёгкая ручка для пункта «Симпатии» в сайдбаре и таб-баре: общее число мэтчей
        и сколько из них текущий пользователь ещё не открывал. Если has_new равен true,
        клиент выделяет счётчик. Мэтч перестаёт быть новым после POST /api/v1/matches/{match_id}/seen.
      responses:
        '200':
          description: Счётчик получен
          content:
            application/json:
              schema:
                type: object
                required: [total, new_count, has_new]
                properties:
                  total:
                    type: integer
                    minimum: 0
                    example: 12
                  new_count:
                    type: integer
                    minimum: 0
                    description: Мэтчи, которые текущий пользователь ещё не открывал (is_new в GET /api/v1/matches).
                    example: 3
                  has_new:
                    type: boolean
                    description: true, если new_count больше нуля.
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /api/v1/matches/{match_id}/seen:
    post:
      security:
        - cookieAuth: []
      summary: Отметить мэтч просмотренным
      description: >-
        Снимает с мэтча признак is_new для текущего пользователя; у собеседника признак не меняется.
        Клиент вызывает ручку при открытии карточки мэтча. Повторный вызов безопасен.
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Мэтч отмечен просмотренным
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Мэтч не найден или пользователь не участник пары
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestError'
              example:
                error:
                  code: MATCH_NOT_FOUND
                  message: Мэтч не найден
        '500':
          $ref: '#/components/responses/InternalServerError'


components:
  parameters:
    MatchId:
      name: match_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  headers:
    SessionCookies:
      description: |
        Две HttpOnly cookie сессии (Secure, SameSite=Lax), клиенту их читать не нужно:
        - access_token - JWT, Path=/, живёт JWT_ACCESS_TTL (по умолчанию 15 минут);
        - refresh_token - непрозрачный токен, Path=/api/v1/auth, живёт JWT_REFRESH_TTL (по умолчанию 30 дней).
      schema:
        type: string
        example: access_token=eyJhbGciOi...; Path=/; HttpOnly; Secure; SameSite=Lax
  schemas:
    Event:
      type: object
      required: [id, name, starts_at, image_url, url, location, categories]
      properties:
        id:
          type: integer
          format: int64
          example: 4180718
        name:
          type: string
          example: Выставка
        starts_at:
          type: string
          format: date-time
          example: '2026-10-30T13:00:00+03:00'
        image_url:
          type: string
          format: uri
          nullable: true
        url:
          type: string
          format: uri
          example: https://example.timepad.ru/event/4180718/
        location:
          type: object
          required: [city, address]
          properties:
            city:
              type: string
              example: Москва
            address:
              type: string
              nullable: true
        categories:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: integer
                example: 458
              name:
                type: string
                example: Выставки
    SearchState:
      type: object
      required: [search_id, expires_at, city, status, events, current_user_liked_event_ids, current_user_finished, partner_finished, matches]
      properties:
        search_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
          description: Фиксированный дедлайн через 24 часа после создания.
        city:
          type: string
          example: Москва
        status:
          type: string
          enum: [voting, waiting_partner, completed, cancelled]
          description: >-
            voting — результат текущего участника ещё не принят;
            waiting_partner — принят только его результат;
            completed — оба результата приняты, matches содержит пересечение;
            cancelled — подбор отменён. При completed и пустом matches показать «Нет совпадений».
        events:
          type: array
          minItems: 1
          maxItems: 10
          description: Полный неизменяемый набор; если найдено меньше 10 событий, возвращаются все найденные.
          items:
            $ref: '#/components/schemas/Event'
        current_user_liked_event_ids:
          type: array
          nullable: true
          uniqueItems: true
          description: null до приёма результата; пустой массив означает отправленный результат без лайков.
          items:
            type: integer
            format: int64
        current_user_finished:
          type: boolean
        partner_finished:
          type: boolean
          description: Принят ли результат партнёра; его индивидуальные лайки не раскрываются.
        matches:
          type: array
          maxItems: 10
          description: Полные карточки пересечения в порядке events; до completed массив пуст.
          items:
            $ref: '#/components/schemas/Event'
    LocationCoordinates:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 56.25
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 37.99
    LocationResponse:
      type: object
      required: [location]
      properties:
        location:
          type: object
          nullable: true
          required: [city, district, coordinates]
          properties:
            city:
              type: string
              minLength: 1
              description: Город, определённый геокодером; для деревни может быть ближайшим городом.
              example: Хотьково
            district:
              type: string
              nullable: true
              description: Административный район или городской округ; null, если не определён.
              example: Сергиево-Посадский городской округ
            coordinates:
              $ref: '#/components/schemas/LocationCoordinates'
    LocationConfirmRequest:
      type: object
      additionalProperties: false
      required: [preview_id]
      properties:
        preview_id:
          type: string
          minLength: 1
          description: Непрозрачный идентификатор результата предварительного определения.
          example: loc_preview_a7b93c
    LocationPreviewResponse:
      type: object
      required: [preview_id, city, district]
      properties:
        preview_id:
          type: string
          minLength: 1
          example: loc_preview_a7b93c
        city:
          type: string
          minLength: 1
          example: Хотьково
        district:
          type: string
          nullable: true
          description: Административный район или городской округ; null, если не определён.
          example: Сергиево-Посадский городской округ
    DatingGoal:
      type: string
      description: Ключ цели знакомства; подписи хранит клиент.
      enum: [relationship, friendship, casual]
      example: relationship
    Missing:
      type: array
      description: >-
        Обязательные поля анкеты, которых не хватает, в порядке шагов онбординга.
        Пустой массив - анкета заполнена и показывается в ленте. Тест сюда не входит.
      items:
        type: string
        enum: [name, birth_date, sex, dating_goal, search_filter, photos]
      example: [search_filter, photos]
    AuthResponse:
      type: object
      required: [user_id, missing]
      properties:
        user_id:
          type: integer
          format: int64
          example: 12
        missing:
          $ref: '#/components/schemas/Missing'
    Photo:
      type: object
      required: [id, url]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        url:
          type: string
          example: http://localhost:8080/cats/cat-1.jpg
    Photos:
      type: object
      required: [photos]
      properties:
        photos:
          type: array
          maxItems: 6
          description: Фото в порядке отображения; photos[0] - главная.
          items:
            $ref: '#/components/schemas/Photo'
    Profile:
      type: object
      required: [user_id, name, birth_date, age, sex, dating_goal, about_me, education, work,
        smoking, alcohol, height, tags, photos, missing]
      properties:
        user_id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        age:
          type: integer
          nullable: true
        sex:
          type: string
          enum: [male, female]
          nullable: true
        dating_goal:
          allOf:
            - $ref: '#/components/schemas/DatingGoal'
          nullable: true
        about_me:
          type: string
          nullable: true
        education:
          allOf:
            - $ref: '#/components/schemas/Education'
          nullable: true
        work:
          type: string
          nullable: true
          maxLength: 100
        smoking:
          allOf:
            - $ref: '#/components/schemas/Attitude'
          nullable: true
        alcohol:
          allOf:
            - $ref: '#/components/schemas/Attitude'
          nullable: true
        height:
          type: integer
          minimum: 100
          maximum: 250
          nullable: true
          description: Рост в сантиметрах.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagKey'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        city:
          type: string
          nullable: true
          description: Текущий город пользователя
          example: Москва
        missing:
          $ref: '#/components/schemas/Missing'
    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 64
          description: Пробелы по краям обрезаются, внутренние схлопываются.
        birth_date:
          type: string
          format: date
          description: Пользователю должно быть не меньше 18 лет.
        sex:
          type: string
          enum: [male, female]
        dating_goal:
          $ref: '#/components/schemas/DatingGoal'
        about_me:
          type: string
          nullable: true
          maxLength: 1000
          description: null или пустая строка очищают описание.
        education:
          allOf:
            - $ref: '#/components/schemas/Education'
          nullable: true
        work:
          type: string
          nullable: true
          maxLength: 100
          description: Пробелы по краям обрезаются; null или пустая строка очищают.
        smoking:
          allOf:
            - $ref: '#/components/schemas/Attitude'
          nullable: true
        alcohol:
          allOf:
            - $ref: '#/components/schemas/Attitude'
          nullable: true
        height:
          type: integer
          minimum: 100
          maximum: 250
          nullable: true
          description: Рост в сантиметрах; null очищает.
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Заменяет набор тегов целиком.
          items:
            $ref: '#/components/schemas/TagKey'
    Education:
      type: string
      description: Ключ уровня образования; подписи хранит клиент.
      enum: [secondary, vocational, incomplete_higher, higher, degree]
      example: higher
    Attitude:
      type: string
      description: Отношение к курению или алкоголю; подписи хранит клиент.
      enum: [negative, neutral, positive]
      example: neutral
    SearchFilter:
      type: object
      additionalProperties: false
      required: [sex, age_from, age_to]
      properties:
        sex:
          type: string
          enum: [male, female, all]
          description: Кого показывать в ленте.
          example: female
        age_from:
          type: integer
          minimum: 18
          maximum: 100
          example: 20
        age_to:
          type: integer
          minimum: 18
          maximum: 100
          description: Включительно, не меньше age_from.
          example: 30
    TagKey:
      type: string
      description: >-
        Ключ тега из фиксированного справочника (таблица tag, миграция 000002).
        Бэкенд справочник не изменяет.
      enum: [coffee, books, music, hiking, bicycle, travel, photo, board_games,
        cooking, running, painting, movies, concerts, animals]
      example: coffee
    TestIdentifier:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Положительный BIGINT в виде десятичной строки.
      example: '1'
    CompatibilityTest:
      type: object
      required: [test_id, title, instructions, answer_options, questions]
      properties:
        test_id:
          $ref: '#/components/schemas/TestIdentifier'
        title:
          type: string
          example: Психологическая анкета
        instructions:
          type: string
          example: Для каждого утверждения выберите один вариант ответа.
        answer_options:
          type: array
          minItems: 1
          description: Общая шкала для всех вопросов; value уникальны и задаются определением теста.
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: integer
                example: 1
              label:
                type: string
                example: Совсем не согласен
        questions:
          type: array
          minItems: 1
          description: Полный список вопросов в порядке отображения; id уникальны.
          items:
            type: object
            required: [id, body]
            properties:
              id:
                $ref: '#/components/schemas/TestIdentifier'
              body:
                type: string
                example: Текст утверждения
    TestAnswers:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          description: >-
            Все ответы теста; порядок не важен. Повторы question_id запрещены.
            Пустой массив, как и неполный набор ответов, - ошибка 422 INVALID_ANSWERS.
          items:
            type: object
            additionalProperties: false
            required: [question_id, value]
            properties:
              question_id:
                $ref: '#/components/schemas/TestIdentifier'
              value:
                type: integer
                description: Одно из значений answer_options выбранного теста. Ноль не означает пропуск.
                example: 4
    TestResult:
      type: object
      required: [result_id, test_id, revision, completed_at, big_five, personality_type, about_personality_type]
      properties:
        result_id:
          $ref: '#/components/schemas/TestIdentifier'
        test_id:
          $ref: '#/components/schemas/TestIdentifier'
        revision:
          type: integer
          minimum: 1
          description: Номер прохождения профиля, а не версия методики.
          example: 1
        completed_at:
          type: string
          format: date-time
          example: '2026-09-25T12:00:00Z'
        big_five:
          $ref: '#/components/schemas/TestBigFive'
        personality_type:
          type: string
          description: Ближайший авторский тип по пяти координатам текущего прохождения; не психологический диагноз. При равных расстояниях выбирается первый тип в списке enum.
          enum: [EXPLORER, VISIONARY, STRATEGIST, INVENTOR, DREAMER, CURATOR, INSPIRER, DEBATER, ORGANIZER, CONNECTOR, COMPANION, DRIVER, ANCHOR, CRAFTSPERSON, OBSERVER, KEEPER]
          example: STRATEGIST
        about_personality_type:
          type: string
          description: Описание выбранного типа на русском языке.
          example: 'Стратег: вам ближе новые идеи, продуманный подход и спокойный формат общения.'
    TestBigFive:
      type: object
      description: Нормализованный вектор текущего прохождения до смешивания с предыдущим профилем. Высокое N означает высокий нейротизм.
      required: [openness, conscientiousness, extraversion, agreeableness, neuroticism]
      properties:
        openness:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.85
        conscientiousness:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.8
        extraversion:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.25
        agreeableness:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.55
        neuroticism:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.2
    TestError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INVALID_ANSWERS
            message:
              type: string
              example: Необходимо ответить на все вопросы теста.
            details:
              type: array
              description: Детали ошибок отдельных ответов для INVALID_ANSWERS.
              items:
                type: object
                required: [question_id, code]
                properties:
                  question_id:
                    $ref: '#/components/schemas/TestIdentifier'
                  code:
                    type: string
                    enum: [MISSING_ANSWER, DUPLICATE_QUESTION, QUESTION_NOT_IN_TEST, VALUE_OUT_OF_RANGE]
  responses:
    PlaceSearchNotFound:
      description: Матч или подбор не существует, недоступен пользователю, истёк или утрачен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TestError'
          example:
            error:
              code: NOT_FOUND
              message: Матч или подбор не найден
    TimepadTimeout:
      description: Истёк таймаут обращения к Timepad; подбор не создан
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TestError'
          example:
            error:
              code: TIMEPAD_TIMEOUT
              message: Сервис подбора событий временно недоступен. Попробуйте позже.
    GeocoderQuotaExceeded:
      description: Quota exceeded — превышен лимит запросов пользователя или исчерпана квота геокодера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TestError'
          example:
            error:
              code: GEOCODER_QUOTA_EXCEEDED
              message: Quota exceeded
    UnsupportedMediaType:
      description: Тело должно быть application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TestError'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Требуется Content-Type application/json
    Unauthorized:
      description: >-
        Access-токен отсутствует, недействителен или истёк. Клиенту нужно вызвать
        POST /api/v1/auth/refresh и повторить запрос; если refresh тоже вернул 401,
        необходимо войти заново.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Необходима авторизация
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Внутренняя ошибка сервера
    ValidationError:
      description: Некорректные поля или параметры запроса
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Проверьте поля запроса
                  fields:
                    type: object
                    description: >-
                      Ошибки по полям тела запроса: ключ - имя поля, значение - текст ошибки.
