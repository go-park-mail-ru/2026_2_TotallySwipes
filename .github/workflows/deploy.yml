name: Deploy microservices

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/test.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            path: ./services/auth/cmd
          - service: profile
            path: ./services/profile/cmd
          - service: matching
            path: ./services/matching/cmd
          - service: chat
            path: ./services/chat/cmd
          - service: gateway
            path: ./gateway/cmd
    steps:
      - uses: actions/checkout@v4

      - name: Image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.microservices
          push: true
          tags: ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            SERVICE_PATH=${{ matrix.path }}
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF

      - name: Upload release
        run: |
          ssh server "mkdir -p ~/app/releases/$GITHUB_SHA/deploy/env && chmod 700 ~/app/releases/$GITHUB_SHA/deploy/env"
          rsync -az --exclude='.git/' --exclude='*.env' --exclude='certs/' --exclude='arifacts/' --exclude='logs/' \
            ./ "server:~/app/releases/$GITHUB_SHA/"

      - name: Upload service env files
        env:
          AUTH_ENV: ${{ secrets.AUTH_ENV }}
          PROFILE_ENV: ${{ secrets.PROFILE_ENV }}
          MATCHING_ENV: ${{ secrets.MATCHING_ENV }}
          CHAT_ENV: ${{ secrets.CHAT_ENV }}
          GATEWAY_ENV: ${{ secrets.GATEWAY_ENV }}
          POSTGRES_ENV: ${{ secrets.POSTGRES_ENV }}
          MINIO_ENV: ${{ secrets.MINIO_ENV }}
        run: |
          set -euo pipefail
          for service in auth profile matching chat gateway postgres minio; do
            secret_name="${service^^}_ENV"
            if [ -z "${!secret_name}" ]; then
              echo "Missing GitHub secret: $secret_name" >&2
              exit 1
            fi
            printf '%s\n' "${!secret_name}" | ssh server "umask 077; cat > ~/app/releases/$GITHUB_SHA/deploy/env/$service.env"
          done

      - name: Login to registry on server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh server "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy microservices
        env:
          LEGACY_PROJECT: ${{ vars.LEGACY_PROJECT || 'app' }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST || 'totallyswipes.ru' }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          ssh server bash -s -- "$GITHUB_SHA" "$prefix" "$LEGACY_PROJECT" "$PUBLIC_HOST" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          prefix="$2"
          export LEGACY_PROJECT="$3"
          export PUBLIC_HOST="$4"
          bash "$HOME/app/releases/$revision/scripts/deploy/deploy.sh" "$HOME/app" "$prefix" "$revision"
          REMOTE

      - name: Logout from registry on server
        if: always()
        run: ssh server 'docker logout ghcr.io' || true
